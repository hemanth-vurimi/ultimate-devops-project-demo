name: Microservices CI

on:
  pull_request:
    branches:
      - qa
  push:
    branches:
      - qa

jobs:
 
  product-catalogue:
      if: |
        contains(github.event.pull_request.title, 'productcatalog') ||
        contains(github.event.pull_request.body, 'productcatalog') ||
        contains(github.event.head_commit.message, 'productcatalog')

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3

      - name: Install Go
        uses: actions/setup-go@v4
        with:
          go-version: '1.22'

      - name: Run Tests & Coverage
        run: |
          cd ./src/productcatalog
          go test ./... -coverprofile=coverage.out

      - name: Sonar Scan
        uses: sonarsource/sonarcloud-github-action@v2
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN_PRODUCT }}
          SONAR_HOST_URL: http://localhost:9000

        with:
          projectBaseDir: ./src/product-catalog   

